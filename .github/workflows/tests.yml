# Runs Jarvis's built-in tests on every change, so a broken update is caught on GitHub
# before it can reach Connor's Mac or PC. Free for this repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Video tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Python parts the tests use
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pytest numpy "opencv-python-headless>=4.8,<5" imageio-ffmpeg Pillow yt-dlp av certifi
      - name: Check every file still compiles
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
