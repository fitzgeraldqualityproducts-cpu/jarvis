<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Studio Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#111a33; --panel:#151f3b; --panel2:#1b2648; --track:#26345e; --line:#22305a;
  --text:#e8ecf8; --muted:#8d9ac0; --soft:#b8c3e6;
  --accent:#7aa2ff; --accent2:#b28cff; --good:#5ee39a; --goodbg:#173d2a; --warn:#fbbf24; --warnbg:#3d3214;
  --bad:#ff7a7a; --badbg:#4a1d24;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed}
a{color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:26px 32px 40px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.logo{font:800 26px var(--font);letter-spacing:-.01em;margin-right:8px}
.logo span{color:var(--accent)} .logo small{font-weight:600;color:var(--muted);font-size:20px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;background:var(--panel2);font-size:14px;color:var(--soft)}
.pill .d{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.good{background:var(--goodbg);color:var(--good)} .pill.good .d{background:var(--good);animation:pulse 2s infinite}
.pill.warn{background:var(--warnbg);color:var(--warn)} .pill.warn .d{background:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)} .pill.bad .d{background:var(--bad)}
.pill.off .d{background:#56607e}
.sp{flex:1}
.upd{font-size:12px;color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,227,154,.6)}70%{box-shadow:0 0 0 9px rgba(94,227,154,0)}100%{box-shadow:0 0 0 0 rgba(94,227,154,0)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.st{background:var(--panel);border-radius:14px;padding:16px 20px;min-width:0}
.st small{color:var(--muted);font-size:13px}
.st b{display:block;font-size:30px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.st i{font-style:normal;color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s}

/* the line */
.line{background:#121a33;border-radius:18px;padding:22px 20px 26px;margin-bottom:18px;position:relative}
.line h3,.box h4{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.line h3{margin-bottom:20px;display:flex;gap:12px;align-items:center}
.line h3 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--soft)}
.scroll{overflow-x:auto;padding-bottom:4px}
.stations{display:grid;grid-template-columns:repeat(9,minmax(120px,1fr));position:relative;min-width:1080px}
.rail{position:absolute;left:5.5%;right:5.5%;top:27px;height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.rail>span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .8s}
.rail>span:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 10px,transparent 10px 28px);
  animation:flow 1.1s linear infinite;opacity:.55}
@keyframes flow{from{background-position:0 0}to{background-position:28px 0}}
.sg{text-align:center;position:relative;padding:0 4px}
.dot{width:58px;height:58px;border-radius:50%;margin:0 auto;background:var(--panel2);border:3px solid #2c3b6a;display:flex;align-items:center;justify-content:center;
  font-size:24px;position:relative;transition:all .4s}
.cnt{position:absolute;top:-6px;right:-10px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#0b1020;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 6px}
.cnt.z{display:none}
.sg.done .dot{background:var(--goodbg);border-color:#38c47a}
.sg.now .dot{background:#2a3d8a;border-color:var(--accent);box-shadow:0 0 0 8px rgba(122,162,255,.16),0 0 30px var(--accent);animation:glow 2.4s ease-in-out infinite}
.sg.failed .dot{background:var(--badbg);border-color:var(--bad)}
@keyframes glow{50%{box-shadow:0 0 0 13px rgba(122,162,255,.08),0 0 44px var(--accent)}}
.sg p{font-size:13px;margin-top:10px;color:var(--soft)} .sg.now p{color:#fff;font-weight:700}
.cards{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:14px}
.card{width:100%;max-width:168px;background:#1d2b55;border-radius:11px;padding:8px;font-size:12px;text-align:left;border:1px solid #3a4d8a;
  animation:pop .5s ease;color:var(--soft)}
.card.now{border-color:var(--accent);box-shadow:0 6px 24px rgba(122,162,255,.25)}
.card.fail{border-color:var(--bad);background:#2c1a2a}
.card.wait{border-color:var(--warn)}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}}
.th{height:84px;border-radius:7px;margin-bottom:7px;display:flex;align-items:flex-end;padding:6px;font-weight:700;font-size:12px;color:#fff;line-height:1.25;
  background-size:cover;background-position:center 30%;position:relative;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.th:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.th span{position:relative}
.card b{color:#fff;font-weight:600}
.card .t{color:var(--muted);font-size:11px;margin-top:3px}
.card .why{font-size:11px;margin-top:5px;line-height:1.35}
.card.fail .why{color:var(--bad)} .card.wait .why{color:var(--warn)}
.prog{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden;position:relative}
.prog>i{position:absolute;top:0;bottom:0;width:40%;background:var(--accent);border-radius:3px;animation:slide 1.6s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
.more{font-size:12px;color:var(--muted)}
.empty{margin-top:18px;padding:14px 18px;border-radius:12px;background:var(--panel);font-size:14px;color:var(--soft);display:none;gap:12px;align-items:center}
.empty.show{display:flex}

/* bottom */
.bottom{display:grid;grid-template-columns:1.1fr 1.3fr .8fr;gap:16px}
.box{background:var(--panel);border-radius:14px;padding:16px 20px;font-size:14px;min-width:0}
.box h4{margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font-style:normal;color:var(--good);white-space:nowrap}
.row em.bad{color:var(--bad)} .row em.warn{color:var(--warn)}
.row .mini{width:30px;height:42px;border-radius:5px;flex:none;background-size:cover;background-position:center;margin-right:10px}
.feed .row{justify-content:flex-start;align-items:flex-start}
.feed .tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:62px;font-size:13px;padding-top:1px}
.feed .tx{min-width:0;line-height:1.4}
.feed .k{width:8px;height:8px;border-radius:50%;flex:none;margin:7px 10px 0 0;background:var(--accent)}
.feed .k.good{background:var(--good)} .feed .k.bad{background:var(--bad)} .feed .k.warn{background:var(--warn)}
.none{color:var(--muted);font-size:13px;padding:8px 0}
.err{display:none;margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:13px}
.err.show{display:block}

@media (max-width:1100px){.bottom{grid-template-columns:1fr 1fr}.bottom .box:last-child{grid-column:1/-1}}
@media (max-width:760px){
  .wrap{padding:18px 16px 30px}.stats{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}
  .logo{font-size:22px}
  .stations{grid-template-columns:1fr;min-width:0;gap:12px}
  .rail{display:none}
  .sg{display:grid;grid-template-columns:70px 1fr;text-align:left;align-items:center;column-gap:8px}
  .sg p{margin-top:0}
  .sg .cards{grid-column:2;margin-top:6px;align-items:flex-start}
  .sg .cards:empty{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo" id="logo">Your channel <small>· Studio</small></div>
    <div class="pill" id="run"><span class="d"></span><span>Loading…</span></div>
    <div class="pill" id="next">Next upload: …</div>
    <div class="sp"></div>
    <div class="upd" id="upd"></div>
  </div>
  <div class="err" id="err"></div>

  <div class="stats">
    <div class="st"><small>Subscribers</small><b id="s-subs">–</b><i id="s-subs-n"></i></div>
    <div class="st"><small>Channel views</small><b id="s-views">–</b><i id="s-views-n"></i></div>
    <div class="st"><small>Shorts live</small><b id="s-live">–</b><i id="s-live-n"></i></div>
    <div class="st"><small>Partner Program progress</small><b id="s-ypp">–</b><div class="bar"><span id="s-ypp-bar" style="width:0"></span></div><i id="s-ypp-n"></i></div>
  </div>

  <div class="line">
    <h3>Where each Short is right now <em id="line-sum"></em></h3>
    <div class="scroll"><div class="stations" id="stations"><div class="rail"><span id="rail" style="width:0"></span></div></div></div>
    <div class="empty" id="empty"><span style="font-size:22px">☕</span><span id="empty-t"></span></div>
  </div>

  <div class="bottom">
    <div class="box"><h4>Recently published</h4><div id="pub"></div></div>
    <div class="box feed"><h4>What Jarvis did lately</h4><div id="feed"></div></div>
    <div class="box"><h4>Health</h4><div id="health"></div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GRADS = [["#ff7a59","#7a4dff"],["#2bd4a0","#246bff"],["#ffb347","#ff5e62"],["#6dd5ed","#2193b0"],["#a18cd1","#fbc2eb"],["#43e97b","#38f9d7"],["#f093fb","#f5576c"]];
const grad = id => { const g = GRADS[(id||0) % GRADS.length]; return `linear-gradient(135deg,${g[0]},${g[1]})`; };
const num = n => n == null ? "–" : n >= 1e6 ? (n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/,"") + "M" : n >= 1e4 ? Math.round(n/1e3) + "K" : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,"") + "K" : String(n);
const clock = t => new Date(t*1000).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
function ago(t, now){
  const s = Math.max(0, now - t);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s/60) + " min";
  if (s < 86400) { const h = Math.floor(s/3600), m = Math.round((s%3600)/60); return h + " h" + (m ? " " + m + " min" : ""); }
  return Math.round(s/86400) + " days";
}
function when(t){
  const d = new Date(t*1000), now = new Date();
  const same = d.toDateString() === now.toDateString();
  const tom = new Date(now.getTime() + 864e5).toDateString() === d.toDateString();
  const day = same ? "Today" : tom ? "Tomorrow" : d.toLocaleDateString([], {weekday:"short"});
  return day + " " + clock(t);
}
function feedTime(t, now){
  return (now - t) < 86400 ? clock(t) : new Date(t*1000).toLocaleDateString([], {weekday:"short"});
}

let page = null, built = false, lastOk = 0;

function buildStations(st){
  const host = $("stations");
  st.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "sg"; el.id = "sg" + i;
    el.innerHTML = `<div class="dot">${s.icon}<span class="cnt z" id="cnt${i}"></span></div><p>${esc(s.label)}</p><div class="cards" id="cards${i}"></div>`;
    host.appendChild(el);
  });
  built = true;
}

function cardHtml(c, now, focus){
  const th = c.thumb ? `background-image:linear-gradient(transparent,transparent),url(/studio/thumb/${c.id}.img)` : `background:${grad(c.id)}`;
  let cls = "card", why = "", bar = "";
  if (c.failed) { cls += " fail"; why = `<div class="why">${esc(c.state === "rejected" ? "Turned down: " : "Stopped: ")}${esc(c.error || "see the log")}</div>`; }
  else if (c.waiting) { cls += " wait"; why = `<div class="why">Retrying at ${clock(c.waiting.until)}${c.waiting.why ? ": " + esc(c.waiting.why) : ""}</div>`; }
  else if (focus) { cls += " now"; }
  if (!c.failed && !c.waiting && c.working) bar = `<div class="prog"><i></i></div>`;
  let t = c.failed ? "" : c.state === "scheduled" && c.publish_at ? `Goes public ${when(+c.publish_at)}` :
          c.state === "ready" ? `Waiting ${ago(c.since, now)}` : `For ${ago(c.since, now)}`;
  if (c.attempts > 0 && !c.failed) t += ` · try ${c.attempts + 1}`;
  return `<div class="${cls}"><div class="th" style="${th}"><span>${esc(c.title)}</span></div><b>${esc(c.doing)}</b>${bar}${t ? `<div class="t">${t}</div>` : ""}${why}</div>`;
}

function emptyReason(d){
  const a = d.autopilot;
  if (d.run.level === "off") return "The YouTube business module is switched off, so nothing is being made.";
  if (!d.channel.connected) return "No business channel is connected yet.";
  if (a.halted) return `Jarvis stopped making new Shorts: ${a.halted.reason}. Ask Claude in the jarvis project to look at it and restart the autopilot.`;
  if (d.run.level === "warn") return d.run.text + ". Nothing is being made right now.";
  if (a.ready >= a.buffer) return d.mode === "manual"
    ? `${a.ready} finished Short${a.ready === 1 ? " is" : "s are"} waiting for you to upload, so Jarvis is holding off on making more.`
    : `${a.ready} finished Short${a.ready === 1 ? " is" : "s are"} queued up, so Jarvis is holding off until one goes out.`;
  if (a.started_today >= a.max_per_day) return `Jarvis made today's limit of ${a.max_per_day} Shorts. It starts again tomorrow.`;
  if (!d.ideas) return "Jarvis is finding fresh ideas before starting the next Short.";
  return "Nothing on the line this second. The next Short starts within a few minutes.";
}

function render(d){
  if (page !== null && d.page && d.page !== page) { location.reload(); return; }
  page = d.page;
  if (!built) buildStations(d.stations);
  const now = d.now;

  // header
  $("logo").innerHTML = (() => { const t = d.channel.title || "Your channel"; const m = t.match(/^([A-Z][a-z]+)([A-Z].*)$/);
    return (m ? `${esc(m[1])}<span>${esc(m[2])}</span>` : esc(t)) + " <small>· Studio</small>"; })();
  document.title = (d.channel.title || "YouTube") + " · Studio";
  const run = $("run"); run.className = "pill " + d.run.level; run.lastElementChild.textContent = d.run.text;
  $("next").textContent = d.next_upload.t ? "Next upload: " + when(d.next_upload.t) : "Next upload: " + (d.next_upload.text || "–");

  // stats
  const s = d.stats;
  $("s-subs").textContent = s.subscribers == null ? "–" : Number(s.subscribers).toLocaleString();
  $("s-subs-n").textContent = s.fetched ? "as of " + feedTime(s.fetched, now) + (now - s.fetched < 86400 ? "" : "") : "not read from YouTube yet";
  $("s-views").textContent = num(s.views == null ? null : +s.views);
  $("s-views-n").textContent = s.fetched ? "all time" : "";
  $("s-live").textContent = d.live_count;
  $("s-live-n").textContent = (d.private_count ? d.private_count + " still private · " : "") +
    d.ideas + " idea" + (d.ideas === 1 ? "" : "s") + " waiting";
  if (s.ypp && s.ypp.share != null) {
    const pct = s.ypp.share * 100;
    $("s-ypp").textContent = (pct < 10 ? pct.toFixed(1) : Math.round(pct)) + "%";
    $("s-ypp-bar").style.width = Math.max(1, pct) + "%";
    const r = s.ypp.rules, v = r.shorts_views_90d;
    $("s-ypp-n").textContent = v && v.have != null ? `${num(v.have)} of ${num(v.need)} Shorts views` + (s.ypp.estimate ? " (estimate)" : "") : "";
  } else { $("s-ypp").textContent = "–"; $("s-ypp-n").textContent = "checked once Shorts are public"; }

  // the line: which Short is "the one being made" (newest active, not failed)
  const active = d.cards.filter(c => !c.failed && c.station <= 5);
  const focus = active.length ? active[active.length - 1] : null;
  const failNow = d.cards.find(c => c.failed);
  d.stations.forEach((st, i) => {
    const sg = $("sg" + i);
    let cls = "sg";
    if (focus) cls += i < focus.station ? " done" : i === focus.station ? " now" : "";
    else if (failNow && i === failNow.station) cls += " failed";
    sg.className = cls;
    const cnt = $("cnt" + i), n = st.count;
    cnt.textContent = n; cnt.className = "cnt" + (n ? "" : " z");
    const here = d.cards.filter(c => c.station === i);
    const shown = here.slice(-2);
    let html = shown.map(c => cardHtml(c, now, focus && c.id === focus.id)).join("");
    if (here.length > 2) html += `<div class="more">+${here.length - 2} more</div>`;
    if (i === 8) html = d.published.slice(0, 1).map(p => `<div class="card"><div class="th" style="${p.thumb ? `background-image:url(/studio/thumb/${p.id}.img)` : `background:${grad(p.id)}`}"><span>${esc(p.title)}</span></div><b>${p.views == null ? "Live" : num(p.views) + " views"}</b><div class="t">Latest upload</div></div>`).join("");
    const box = $("cards" + i);
    if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
  });
  const railTo = focus ? focus.station / 8 : 0;
  $("rail").style.width = (railTo * 100) + "%";
  const making = d.cards.filter(c => !c.failed && c.station <= 5).length;
  $("line-sum").textContent = making ? `${making} being made · ${d.autopilot.ready} ready` : d.autopilot.ready ? `${d.autopilot.ready} ready` : "";
  const empty = !focus;
  $("empty").className = "empty" + (empty ? " show" : "");
  if (empty) $("empty-t").textContent = emptyReason(d);

  // recently published
  $("pub").innerHTML = d.published.length ? d.published.slice(0, 5).map(p =>
    `<div class="row"><span style="display:flex;align-items:center;min-width:0"><span class="mini" style="${p.thumb ? `background-image:url(/studio/thumb/${p.id}.img)` : `background:${grad(p.id)}`}"></span>` +
    `<a class="l" href="https://youtube.com/shorts/${esc(p.youtube_id)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(p.title)}</a></span>` +
    `<em class="${p.privacy === "public" ? "" : "warn"}">${p.privacy !== "public" ? esc(p.privacy || "") : p.views == null ? "new" : num(p.views) + " views"}</em></div>`).join("")
    : `<div class="none">Nothing published yet. The first Short will show up here.</div>`;

  // activity
  $("feed").innerHTML = d.activity.length ? d.activity.slice(0, 7).map(e =>
    `<div class="row"><span class="tm">${feedTime(e.t, now)}</span><span class="k ${e.kind}"></span><span class="tx">${esc(e.text)}</span></div>`).join("")
    : `<div class="none">No activity in the last few days.</div>`;

  // health
  const a = d.autopilot, fs = a.failure_streak, stop = d.stop_after;
  const rows = [
    ["Failures in a row", `${fs} of ${stop}`, fs === 0 ? "" : fs >= stop - 1 ? "bad" : "warn"],
    ["Started today", `${a.started_today} of ${a.max_per_day}`, ""],
    ["Waiting to upload", `${a.ready} of ${a.buffer}`, ""],
    ["Upload mode", {manual: "You upload", private: "Private", public: "Public"}[d.mode] || d.mode, d.mode === "public" ? "" : "warn"],
    ["Running cost", "$" + Math.round(d.cost_usd || 0), (d.cost_usd || 0) > 0 ? "bad" : ""],
  ];
  const hw = d.hardware || {};
  if (hw.gpu) rows.push(["Graphics card", `${hw.gpu.used_gb} of ${hw.gpu.total_gb} GB` +
      (hw.gpu.temp_c != null ? ` · ${Math.round(hw.gpu.temp_c)}°C` : ""), hw.gpu.temp_c >= 85 ? "bad" : hw.gpu.temp_c >= 78 ? "warn" : ""]);
  if (hw.load != null) rows.push(["Processor", Math.round(hw.load * 100) + "% busy", hw.load > 0.9 ? "warn" : ""]);
  if (hw.memory != null) rows.push(["Memory", Math.round(hw.memory * 100) + "% used", hw.memory > 0.9 ? "warn" : ""]);
  for (const [k, v] of Object.entries(hw.drives || {}))
    rows.push([k.length === 1 ? `Drive ${k}: free` : "Disk free", v + " GB", v < 10 ? "bad" : v < 25 ? "warn" : ""]);
  if (d.backup) rows.push(["Last backup", d.backup.hours_ago == null ? "none yet" : d.backup.hours_ago < 1 ? "under an hour ago" :
      Math.round(d.backup.hours_ago) + " h ago", d.backup.hours_ago == null || d.backup.hours_ago > 36 ? "warn" : ""]);
  $("health").innerHTML = rows.map(r => `<div class="row"><span>${r[0]}</span><em class="${r[2]}">${esc(r[1])}</em></div>`).join("");

  $("upd").textContent = "Live · updated " + clock(now);
}

async function tick(){
  try {
    const r = await fetch("/studio/state" + location.search, {cache: "no-store"});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    render(d); lastOk = Date.now();
    $("err").className = "err";
  } catch (e) {
    if (Date.now() - lastOk > 15000) {
      $("err").textContent = "Can't reach Jarvis right now. This page will catch up by itself once Jarvis is running again.";
      $("err").className = "err show";
      $("upd").textContent = "";
    }
  }
}
tick();
setInterval(tick, 4000);
</script>
</body>
</html>
